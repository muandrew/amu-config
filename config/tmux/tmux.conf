set-option -g set-titles on

# Device label, then session label, then tmux's normal status/title.
set-option -g @amu-trn "$AMU_TRN"
set-option -g status-left '#{?@amu-trn,#{@amu-trn} · ,}#{?@amu-tsrn,#{@amu-tsrn} · ,}[#{session_name}] '
set-option -g status-left-length 100
set-option -g set-titles-string '#{?@amu-trn,#{@amu-trn} · ,}#{?@amu-tsrn,#{@amu-tsrn} · ,}#S:#I:#W - "#T" #{session_alerts}'
